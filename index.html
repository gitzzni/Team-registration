<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      font-size: 18px;
    }

    h2 {
      font-size: 28px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      font-size: 18px;
    }

    button {
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>Event Registration</h2>

<input id="twitter" placeholder="Twitter Username">
<input id="lastfm" placeholder="Last.fm Username">
<input id="link" placeholder="Last.fm Account Link">

<button onclick="register()">Register</button>

<p id="result"></p>

<script>
const API_URL = 'YOUR_APPS_SCRIPT_URL';

function register() {
  const data = {
    twitter: document.getElementById('twitter').value,
    lastfm: document.getElementById('lastfm').value,
    link: document.getElementById('link').value
  };

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(result => {
    document.getElementById('result').textContent =
      'Registration complete! You are on ' + result.team + '.';
  });
}
</script>

</body>
</html>
